# Real stations (NOAA ISD airport records, 2016-2024). One entry per station. The system is single-station: never compare against neighbours.
# `cadence_minutes` is how often the station reports in the data we replay (hourly METAR = 60, 3-hourly SYNOP = 180).
# `resolution` says how the station rounds what it reports (Indian METAR: whole degC, whole hPa). It is informational:
# the pipeline learns the effect itself (atmos/limits.py). Coordinates and elevation are NOAA's own station metadata.
