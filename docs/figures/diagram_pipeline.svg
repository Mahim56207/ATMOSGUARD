<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 860" width="1700" height="860" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="1700" height="860" fill="#fbfaf7"/><text x="40" y="52" font-size="30" font-weight="700" fill="#16150f" text-anchor="start">What one reading goes through</text><text x="40" y="82" font-size="18" font-weight="400" fill="#5b5a53" text-anchor="start">One station, its own history, no neighbours. Temperature, pressure and humidity only.</text><rect x="40" y="130" width="340" height="170" rx="10" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/><text x="56" y="158" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Where readings come from</text><text x="56" y="184" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">ESP32 + BME280 (layer 0 runs on the</text><text x="56" y="204" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">device)</text><text x="56" y="224" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Replay of real records</text><text x="56" y="244" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Live fault injection (the demo)</text><rect x="40" y="340" width="340" height="190" rx="10" fill="#efeee9" stroke="#8a8a80" stroke-width="1.5"/><text x="56" y="368" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Learned per station</text><text x="56" y="394" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">What is normal for this month and</text><text x="56" y="414" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">hour</text><text x="56" y="434" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">The reporting resolution</text><text x="56" y="454" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">The longest ordinary frozen run, the</text><text x="56" y="474" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">jitter, the usual step</text><line x1="380" y1="215" x2="470" y2="215" stroke="#8a8a80" stroke-width="2.4"/><polygon points="470.0,215.0 460.1,219.8 460.1,210.2" fill="#8a8a80"/><line x1="380" y1="435" x2="470" y2="435" stroke="#8a8a80" stroke-width="2.4"/><polygon points="470.0,435.0 460.1,439.8 460.1,430.2" fill="#8a8a80"/><rect x="470" y="120" width="520" height="108" rx="10" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/><text x="488" y="154" font-size="21" font-weight="700" fill="#16150f" text-anchor="start">L0 physics</text><text x="488" y="182" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">ranges, dew point &lt;= temperature, wet-bulb (soft</text><text x="488" y="203" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">flag)</text><rect x="470" y="242" width="520" height="108" rx="10" fill="#fdece5" stroke="#eb6834" stroke-width="1.5"/><text x="488" y="276" font-size="21" font-weight="700" fill="#16150f" text-anchor="start">L1 health</text><text x="488" y="304" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">frozen (two tiers), step, spike, noise, gaps, CUSUM</text><rect x="470" y="364" width="520" height="108" rx="10" fill="#e3f6ee" stroke="#1baf7a" stroke-width="1.5"/><text x="488" y="398" font-size="21" font-weight="700" fill="#16150f" text-anchor="start">L2 normality</text><text x="488" y="426" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">is this normal for THIS station, month and hour?</text><rect x="470" y="486" width="520" height="108" rx="10" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="1.5"/><text x="488" y="520" font-size="21" font-weight="700" fill="#16150f" text-anchor="start">L3 multivariate</text><text x="488" y="548" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">Isolation Forest, and a Mahalanobis distance of</text><text x="488" y="569" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">departures and rates of change</text><rect x="470" y="608" width="520" height="108" rx="10" fill="#fdf3dc" stroke="#e6a10a" stroke-width="1.5"/><text x="488" y="642" font-size="21" font-weight="700" fill="#16150f" text-anchor="start">Timing</text><text x="488" y="670" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">a wrong clock (3 h), a same-instant jump on several</text><text x="488" y="691" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">channels</text><line x1="990" y1="350" x2="1080" y2="350" stroke="#8a8a80" stroke-width="2.4"/><polygon points="1080.0,350.0 1070.1,354.8 1070.1,345.2" fill="#8a8a80"/><rect x="1080" y="120" width="320" height="596" rx="10" fill="#ffffff" stroke="#16150f" stroke-width="2"/><text x="1100" y="156" font-size="24" font-weight="700" fill="#16150f" text-anchor="start">Fusion</text><text x="1100" y="194" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">Impossible, frozen or missing</text><text x="1100" y="220" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">   -&gt; FAULT</text><text x="1100" y="246" font-size="16" font-weight="400" fill="#16150f" text-anchor="start"></text><text x="1100" y="272" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">One channel jumps while the</text><text x="1100" y="298" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">others are actually quiet</text><text x="1100" y="324" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">   -&gt; FAULT</text><text x="1100" y="350" font-size="16" font-weight="400" fill="#16150f" text-anchor="start"></text><text x="1100" y="376" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">Several channels move or</text><text x="1100" y="402" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">depart together</text><text x="1100" y="428" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">   -&gt; WEATHER (an alert)</text><text x="1100" y="454" font-size="16" font-weight="400" fill="#16150f" text-anchor="start"></text><text x="1100" y="480" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">Unusual but ambiguous</text><text x="1100" y="506" font-size="16" font-weight="400" fill="#16150f" text-anchor="start">   -&gt; SUSPECT</text><line x1="1400" y1="350" x2="1450" y2="350" stroke="#8a8a80" stroke-width="2.4"/><polygon points="1450.0,350.0 1440.1,354.8 1440.1,345.2" fill="#8a8a80"/><rect x="1450" y="150" width="210" height="88" rx="44" fill="#efeee9" stroke="#8a8a80" stroke-width="2.5"/><text x="1555" y="188" font-size="22" font-weight="700" fill="#16150f" text-anchor="middle">VALID</text><text x="1555" y="214" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="middle">trust it</text><rect x="1450" y="270" width="210" height="88" rx="44" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="2.5"/><text x="1555" y="308" font-size="22" font-weight="700" fill="#16150f" text-anchor="middle">WEATHER</text><text x="1555" y="334" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="middle">escalate, never delete</text><rect x="1450" y="390" width="210" height="88" rx="44" fill="#fdf3dc" stroke="#e6a10a" stroke-width="2.5"/><text x="1555" y="428" font-size="22" font-weight="700" fill="#16150f" text-anchor="middle">SUSPECT</text><text x="1555" y="454" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="middle">review, value kept</text><rect x="1450" y="510" width="210" height="88" rx="44" fill="#fbe7e7" stroke="#d03b3b" stroke-width="2.5"/><text x="1555" y="548" font-size="22" font-weight="700" fill="#16150f" text-anchor="middle">FAULT</text><text x="1555" y="574" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="middle">sensor problem</text><rect x="470" y="748" width="1190" height="92" rx="10" fill="#ffffff" stroke="#b9b8ac" stroke-width="1.5"/><text x="488" y="778" font-size="17" font-weight="700" fill="#16150f" text-anchor="start">Every verdict also carries</text><text x="488" y="802" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">a plain-English reason  |  a health score and the drift monitor  |  a maintenance ticket and service date  |  an estimate with an</text><text x="488" y="822" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">uncertainty band (the raw value is never overwritten)</text></svg>