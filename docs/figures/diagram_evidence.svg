<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 560" width="1700" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="1700" height="560" fill="#fbfaf7"/><text x="40" y="52" font-size="30" font-weight="700" fill="#16150f" text-anchor="start">The order the evidence was produced in</text><text x="40" y="82" font-size="18" font-weight="400" fill="#5b5a53" text-anchor="start">Each step is a commit. Nothing was tuned after the holdout was read.</text><rect x="30" y="140" width="200" height="340" rx="10" fill="#e6f0fb" stroke="#2a78d6" stroke-width="2"/><circle cx="66" cy="184" r="20" fill="#2a78d6"/><text x="66" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="46" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Protocol</text><text x="46" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Splits, extreme-</text><text x="46" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">weather rules,</text><text x="46" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">metrics and</text><text x="46" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">baselines written</text><text x="46" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">and committed first</text><line x1="234" y1="310" x2="266" y2="310" stroke="#8a8a80" stroke-width="2.4"/><polygon points="266.0,310.0 256.1,314.8 256.1,305.2" fill="#8a8a80"/><rect x="270" y="140" width="200" height="340" rx="10" fill="#e3f6ee" stroke="#1baf7a" stroke-width="2"/><circle cx="306" cy="184" r="20" fill="#1baf7a"/><text x="306" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="286" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Train and tune</text><text x="286" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Own 2016-2019</text><text x="286" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">record per station;</text><text x="286" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">tuning on six DEV</text><text x="286" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">stations, 2020-2021</text><text x="286" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">only</text><line x1="474" y1="310" x2="506" y2="310" stroke="#8a8a80" stroke-width="2.4"/><polygon points="506.0,310.0 496.1,314.8 496.1,305.2" fill="#8a8a80"/><rect x="510" y="140" width="200" height="340" rx="10" fill="#fdf3dc" stroke="#e6a10a" stroke-width="2"/><circle cx="546" cy="184" r="20" fill="#e6a10a"/><text x="546" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="526" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Freeze</text><text x="526" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Code and settings</text><text x="526" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">frozen; real-data</text><text x="526" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">failures and their</text><text x="526" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">fixes are in the</text><text x="526" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">tuning log</text><line x1="714" y1="310" x2="746" y2="310" stroke="#8a8a80" stroke-width="2.4"/><polygon points="746.0,310.0 736.1,314.8 736.1,305.2" fill="#8a8a80"/><rect x="750" y="140" width="200" height="340" rx="10" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="2"/><circle cx="786" cy="184" r="20" fill="#4a3aa7"/><text x="786" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="766" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Holdout, once</text><text x="766" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Same six stations</text><text x="766" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">2022-2024 and eight</text><text x="766" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">unseen stations; a</text><text x="766" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">lock file records</text><text x="766" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">the run</text><line x1="954" y1="310" x2="986" y2="310" stroke="#8a8a80" stroke-width="2.4"/><polygon points="986.0,310.0 976.1,314.8 976.1,305.2" fill="#8a8a80"/><rect x="990" y="140" width="200" height="340" rx="10" fill="#fbe7e7" stroke="#d03b3b" stroke-width="2"/><circle cx="1026" cy="184" r="20" fill="#d03b3b"/><text x="1026" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1006" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Post-mortem</text><text x="1006" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">3 of 98 windows got</text><text x="1006" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">a FAULT; causes</text><text x="1006" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">explained, remedies</text><text x="1006" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">proposed, nothing</text><text x="1006" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">tuned</text><line x1="1194" y1="310" x2="1226" y2="310" stroke="#8a8a80" stroke-width="2.4"/><polygon points="1226.0,310.0 1216.1,314.8 1216.1,305.2" fill="#8a8a80"/><rect x="1230" y="140" width="200" height="340" rx="10" fill="#fdece5" stroke="#eb6834" stroke-width="2"/><circle cx="1266" cy="184" r="20" fill="#eb6834"/><text x="1266" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="1246" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Amendments</text><text x="1246" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">1: fairer detection</text><text x="1246" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">scoring. 2:</text><text x="1246" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">remedies tested on</text><text x="1246" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">twelve fresh</text><text x="1246" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">stations, rule set</text><text x="1246" y="390" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">first</text><line x1="1434" y1="310" x2="1466" y2="310" stroke="#8a8a80" stroke-width="2.4"/><polygon points="1466.0,310.0 1456.1,314.8 1456.1,305.2" fill="#8a8a80"/><rect x="1470" y="140" width="200" height="340" rx="10" fill="#efeee9" stroke="#8a8a80" stroke-width="2"/><circle cx="1506" cy="184" r="20" fill="#8a8a80"/><text x="1506" y="191" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="1486" y="246" font-size="18" font-weight="700" fill="#16150f" text-anchor="start">Fresh run, once</text><text x="1486" y="280" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">Twelve stations</text><text x="1486" y="302" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">nobody had looked</text><text x="1486" y="324" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">at; the registered</text><text x="1486" y="346" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">rule decides,</text><text x="1486" y="368" font-size="15" font-weight="400" fill="#5b5a53" text-anchor="start">whatever it says</text><text x="40" y="530" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">Reported for every split: false alarms on clean data, real extreme weather, injected faults, NOAA flags, drift. Never merged into one score.</text></svg>