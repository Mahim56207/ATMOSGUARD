<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="1600" height="620" fill="#fbfaf7"/><text x="40" y="52" font-size="30" font-weight="700" fill="#16150f" text-anchor="start">Is this the sensor, or is this the sky?</text><text x="40" y="82" font-size="18" font-weight="400" fill="#5b5a53" text-anchor="start">The four verdicts, and what each one looks like on the three channels (sketches).</text><rect x="40" y="120" width="360" height="470" rx="10" fill="#fbe7e7" stroke="#d03b3b" stroke-width="2"/><text x="58" y="156" font-size="19" font-weight="700" fill="#16150f" text-anchor="start">FAULT: one channel jumps</text><text x="58" y="184" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">The others stay calm.</text><text x="58" y="232" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start">T</text><line x1="100" y1="312" x2="370" y2="312" stroke="#b9b8ac" stroke-width="1"/><polyline points="100.0,266.0 138.6,266.0 177.1,266.0 215.7,266.0 254.3,266.0 292.9,266.0 331.4,266.0 370.0,266.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="350" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start">P</text><line x1="100" y1="430" x2="370" y2="430" stroke="#b9b8ac" stroke-width="1"/><polyline points="100.0,375.6 138.6,375.6 177.1,375.6 215.7,375.6 254.3,375.6 292.9,375.6 331.4,375.6 370.0,375.6" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="468" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">RH</text><line x1="100" y1="548" x2="370" y2="548" stroke="#b9b8ac" stroke-width="1"/><polyline points="100.0,527.2 138.6,527.2 177.1,527.2 215.7,468.4 254.3,468.4 292.9,468.4 331.4,468.4 370.0,468.4" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="425" y="120" width="360" height="470" rx="10" fill="#ebe8f7" stroke="#4a3aa7" stroke-width="2"/><text x="443" y="156" font-size="19" font-weight="700" fill="#16150f" text-anchor="start">WEATHER: all move together</text><text x="443" y="184" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">A cyclone, a front, an outflow.</text><text x="443" y="232" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start">T</text><line x1="485" y1="312" x2="755" y2="312" stroke="#b9b8ac" stroke-width="1"/><polyline points="485.0,249.2 523.6,249.2 562.1,257.6 600.7,270.2 639.3,282.8 677.9,282.8 716.4,278.6 755.0,274.4" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="443" y="350" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start">P</text><line x1="485" y1="430" x2="755" y2="430" stroke="#b9b8ac" stroke-width="1"/><polyline points="485.0,358.8 523.6,358.8 562.1,367.2 600.7,388.2 639.3,413.4 677.9,409.2 716.4,384.0 755.0,367.2" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="443" y="468" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">RH</text><line x1="485" y1="548" x2="755" y2="548" stroke="#b9b8ac" stroke-width="1"/><polyline points="485.0,518.8 523.6,518.8 562.1,510.4 600.7,493.6 639.3,472.6 677.9,468.4 716.4,476.8 755.0,485.2" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="810" y="120" width="360" height="470" rx="10" fill="#fbe7e7" stroke="#d03b3b" stroke-width="2"/><text x="828" y="156" font-size="19" font-weight="700" fill="#16150f" text-anchor="start">FAULT: flat for too long</text><text x="828" y="184" font-size="16" font-weight="400" fill="#5b5a53" text-anchor="start">Longer than this station ever holds.</text><text x="828" y="232" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start">T</text><line x