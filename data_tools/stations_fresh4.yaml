# The FRESH4 stations (Amendment 5): twelve northern US airport stations, hourly routine METAR (reported at :53 or similar, so `any_minute`), whole degrees, winters with freezing
# rain and wet snow. Chosen to test a freezing-point remedy on stations nobody has looked at. Selection rule fixed before any verdict: a seeded random sample (seed 11) of 40 US
# stations north of 40 N with K-prefixed ICAO codes and data in 2016 and 2024, not used in any earlier set; kept if at least 60 % of expected hourly reports carry temperature,
# dew point and pressure in both the training years (2016-2019) and the test years (2020-2024) and the median gap is 50-70 minutes; stations carrying a duplicate report stream
# (coverage above 120 %) were dropped; the first twelve in list order were taken. Source: NOAA ISD.
years: {first: 2016, last: 2024}
stations:
  GSH: {file: '72438814829', name: Goshen Municipal Airport, lat: 41.527, lon: -85.787, elevation_m: 251.2, climate_zone: 'northern US, freezing winters', source: metar, cadence_minutes: 60, any_minute: true}
