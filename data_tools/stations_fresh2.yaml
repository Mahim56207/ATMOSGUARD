# The FRESH2 stations: twelve stations that were not used for anything before Amendment 3 in config/protocol.md was written (not for
# training, tuning, DEV, the holdout, FRESH, the demo or any post-mortem). Five are Indian airport stations (hourly METAR, whole degrees);
# seven are Australian Bureau of Meteorology automatic weather stations reporting SYNOP hourly at 0.1 C and 0.1 hPa, so this set contains
# real non-airport AWS records with fine reporting resolution and tropical-cyclone exposure. Source: NOAA ISD (noaa-global-hourly-pds).
# Selection rule, fixed before any verdict was computed: at least 60 % of the expected hourly reports in both the training years
# (2016-2019) and the test years (2020-2024) with temperature, dew point and pressure; then a spread of climates. Candidates that failed the
# coverage rule (Agartala, Bhopal, Varanasi, Milingimbi, Cape Moreton, Mount Hotham and others) were not used. Coverage was the only thing
# looked at. Identity, coordinates and elevation are the NAME / LATITUDE / LONGITUDE / ELEVATION columns of the raw NOAA files.
years: {first: 2016, last: 2024}
stations:
  HYD: {file: '43128599999', name: 'Hyderabad International Airport', lat: 17.233, lon: 78.417, elevation_m: 617.0, climate_zone: tropical semi-arid plateau (Rajiv Gandhi Intl airport), source: metar, cadence_minutes: 60}
  BLR: {file: '42705699999', name: 'Bangaluru International Airport', lat: 13.2, lon: 77.7, elevation_m: 915.0, climate_zone: tropical highland (Kempegowda Intl airport), source: metar, cadence_minutes: 60}
  CCJ: {file: '42705599999', name: 'Calicut', lat: 11.137, lon: 75.955, elevation_m: 104.24, climate_zone: tropical humid west coast (Calicut airport), source: metar, cadence_minutes: 60}
  IXM: {file: '43360099999', name: 'Madurai', lat: 9.835, lon: 78.093, elevation_m: 139.9, climate_zone: tropical interior south (Madurai airport), source: metar, cadence_minutes: 60}
  VGA: {file: '43181099999', name: 'Vijayawada', lat: 16.53, lon: 80.797, elevation_m: 24.99, climate_zone: tropical east coast (Vijayawada airport), source: metar, cadence_minutes: 60}
  CWS: {file: '94147099999', name: 'Cape Wessel AWS', lat: -11.017, lon: 136.75, elevation_m: 19.0, climate_zone: Australian Top End monsoon coast (Cape Wessel AWS), source: synop, cadence_minutes: 60}
  LEI: {file: '94388099999', name: 'Lady Elliot Island', lat: -24.117, lon: 152.717, elevation_m: 4.0, climate_zone: 'Coral Sea island, cyclone path (Lady Elliot Island AWS)', source: synop, cadence_minutes: 60}
  WIL: {file: '94299099999', name: 'Willis Island', lat: -16.288, lon: 149.965, elevation_m: 9.0, climate_zone: 'remote Coral Sea island, cyclone path (Willis Island)', source: synop, cadence_minutes: 60}
  GLS: {file: '94461099999', name: 'Giles Meteorological Office', lat: -25.033, lon: 128.3, elevation_m: 599.0, climate_zone: central Australian desert (Giles Meteorological Office), source: synop, cadence_minutes: 60}
  COT: {file: '94842099999', name: 'Cape Otway Lighthouse', lat: -38.85, lon: 143.517, elevation_m: 83.0, climate_zone: 'Bass Strait maritime, storm track (Cape Otway lighthouse)', source: synop, cadence_minutes: 60}
  THB: {file: '95909099999', name: 'Thredbo AWS', lat: -36.5, lon: 148.283, elevation_m: 1368.0, climate_zone: 'Australian Alps, alpine cold (Thredbo AWS)', source: synop, cadence_minutes: 60}
  MTC: {file: '94678099999', name: 'Mount Crawford AWS', lat: -34.733, lon: 138.933, elevation_m: 525.0, climate_zone: South Australian ranges (Mt Crawford AWS), source: synop, cadence_minutes: 60}
