# Thirty-one Indian stations (the six DEV stations, the eight holdout stations, the twelve fresh stations and the five Indian airports of fresh-2), used only for the peer-layer study
# on Indian station spacing (evaluate_peers.py --cluster india --radius-km 600). Airport METAR, whole degrees, hourly (some 3-hourly SYNOP). Built by data_tools/make_peers.py from the
# station files already in the repository; nothing new is downloaded and nothing is tuned: this only reads the anomalies of stations whose own single runs are finished.
