# Real stations used for validation. Source: NOAA ISD (noaa-global-hourly-pds). Coordinates and elevation are from
# NOAA's own station history file (isd-history.csv). `source` says which report type carries the data:
# metar = routine METAR (whole degC, whole hPa QNH); synop = SYNOP (0.1 degC, 0.1 hPa sea-level pressure).
# climate_zone is our own coarse label (Koppen-style) so leave-one-zone-out results can be reported.
years: {first: 2016, last: 2024}
stations:
  BBI:  {file: "42971099999", name: "Bhubaneswar (Biju Patnaik Intl, VEBS)", lat: 20.244, lon: 85.818, elevation_m: 42.1,   climate_zone: "tropical coastal east", source: metar, cadence_minutes: 60}
