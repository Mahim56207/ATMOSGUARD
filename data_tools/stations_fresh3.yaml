  TNC: {file: '94238099999', name: Tennant Creek Airport, lat: -19.633, lon: 134.183, elevation_m: 377.0, climate_zone: central Australian semi-arid, source: synop, cadence_minutes: 60}
  ASP: {file: '94326099999', name: Alice Springs, lat: -23.807, lon: 133.902, elevation_m: 545.28, climate_zone: central Australian desert, source: synop, cadence_minutes: 60}
  LRM: {file: '94302099999', name: Learmonth, lat: -22.236, lon: 114.089, elevation_m: 5.79, climate_zone: 'north-west coast, cyclone exposure', source: synop, cadence_minutes: 60}
  BRM: {file: '94203099999', name: Broome International, lat: -17.945, lon: 122.232, elevation_m: 17.06, climate_zone: 'Kimberley coast, tropical', source: synop, cadence_minutes: 60}
